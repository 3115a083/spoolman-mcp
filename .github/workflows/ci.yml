name: Test MCP container and OAuth gateway
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed legacy configuration
        run: sh scripts/test-config.sh
      - name: Build legacy image
        run: docker build --pull -t spoolman-mcp:test .
      - name: Legacy MCP authentication regression
        run: sh scripts/test-container.sh spoolman-mcp:test
  oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r oauth_gateway/requirements.txt
      - name: Syntax and authorization tests
        run: |
          python -m compileall -q oauth_gateway
          python -m unittest discover -s oauth_gateway/tests -v
      - name: Build separate legacy OAuth image regression
        run: docker build -f oauth_gateway/Dockerfile -t spoolman-mcp-oauth:old-test .
  unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build unified OAuth-only image
        run: docker build -f Dockerfile.unified -t spoolman-mcp:unified-test .
      - name: Smoke test one listener and OAuth 401
        run: sh scripts/test-unified.sh spoolman-mcp:unified-test
