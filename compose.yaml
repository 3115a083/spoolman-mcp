services:
  spoolman-mcp:
    image: spoolman-mcp:local
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-18788}:8080"
    environment:
      SPOOLMAN_URL: ${SPOOLMAN_URL:?Set SPOOLMAN_URL in a local .env file}
      MCP_PROXY_API_KEY: ${MCP_PROXY_API_KEY:?Set a random MCP_PROXY_API_KEY in a local .env file}
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8080/ping").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
